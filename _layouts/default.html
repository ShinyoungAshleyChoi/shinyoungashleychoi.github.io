<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 155 }}">
    <link rel="stylesheet" href="{{ '/css/pygments.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/stackroom.css' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/img/favicon.png' | relative_url }}">
</head>
<body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <header class="masthead frame">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav aria-label="블로그 메뉴">
            <a href="{{ '/' | relative_url }}">게시글</a>
            <a href="{{ '/search/' | relative_url }}">검색</a>
            <a href="{{ '/tags/' | relative_url }}">태그</a>
            <a href="{{ '/archives/' | relative_url }}">아카이브</a>
            <a href="{{ '/about/' | relative_url }}">소개</a>
        </nav>
    </header>

    <main id="main" class="frame main">
        {{ content }}
    </main>

    <footer class="frame footer">
        <span class="author">
            <img src="{{ '/img/favicon.png' | relative_url }}" alt="개발자와 고양이 픽셀 아트" width="816" height="654">
            Shinyoung Choi
        </span>
        <a href="https://github.com/shinyoungashleychoi">GitHub</a>
    </footer>

    <script src="{{ '/search.js' | relative_url }}"></script>
    <script src="{{ '/theme.js' | relative_url }}"></script>
</body>
</html>
