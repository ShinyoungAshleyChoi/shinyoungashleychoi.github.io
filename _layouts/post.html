---
layout: default
---

<article class="article">
    <header class="article-head">
        <h1>{{ page.title | escape }}</h1>
        {% if page.date or page.tags.size > 0 %}
            <div class="article-meta">
                {% if page.date %}
                    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y.%m.%d" }}</time>
                {% endif %}
                {% for tag in page.tags %}
                    <a href="{{ tag | prepend: '/tags/' | append: '/' | relative_url }}">#{{ tag | escape }}</a>
                {% endfor %}
            </div>
        {% endif %}
    </header>
    <div class="reading">
        <nav class="contents" aria-labelledby="toc-title" hidden>
            <h2 id="toc-title">이 글의 목차</h2>
            <ul id="toc"></ul>
        </nav>
        <div class="prose" id="post-body">{{ content }}</div>
    </div>
</article>
